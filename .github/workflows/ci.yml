name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build plugin twice
        run: |
          python scripts/build_chatgpt_plugin.py --output /tmp/one.zip
          python scripts/build_chatgpt_plugin.py --output /tmp/two.zip
          cmp /tmp/one.zip /tmp/two.zip
          unzip -t /tmp/one.zip

